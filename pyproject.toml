[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repotrail"
version = "1.1.0"
description = "Verified local Python repository context, committed changes, and optional grounded AI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = ["pydantic>=2.12,<3"]

[project.optional-dependencies]
ai = ["langchain>=1.4.7,<2", "langchain-google-genai>=4.4.2,<5", "langchain-groq>=1.1.3,<2", "langgraph>=1.2.16,<2", "langgraph-checkpoint-sqlite>=3.1.2,<4"]
mcp = ["mcp>=2.3.0,<3"]
dev = ["ruff>=0.17.1,<0.18", "mypy>=2.4,<3", "build>=1.6,<2"]

[project.scripts]
repotrail = "repotrail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
files = ["src/repotrail"]
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
