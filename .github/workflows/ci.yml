name: Package checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.14']
    runs-on: ${{ matrix.os }}
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      LANGSMITH_TRACING: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[ai,mcp,dev]'
      - run: python -m pip check
      - run: python -m ruff check src examples scripts/build_skill.py skills
      - run: python -m ruff format --check src examples scripts/build_skill.py skills
      - run: python -m mypy src/repotrail
      - run: python -m build
      - run: python scripts/build_skill.py --check
      - run: python -m repotrail --version
      - run: python -m repotrail --help
