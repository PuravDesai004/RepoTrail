name: Offline checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.14']
    runs-on: ${{ matrix.os }}
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      LANGSMITH_TRACING: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[ai,mcp,dev]'
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m ruff check src tests evals examples
      - run: python -m ruff format --check src tests evals examples
      - run: python -m mypy src/repotrail
      - run: python -m evals.run --output .local/evaluation.json
      - run: python -m build
      - name: Clean wheel install outside source checkout
        run: python examples/verify_wheel.py
