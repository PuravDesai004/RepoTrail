name: Package checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.14']
    runs-on: ${{ matrix.os }}
    env:
      LANGSMITH_TRACING: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[ai,mcp,dev]'
      - run: python -m pip check
      - run: python -m ruff check src skills
      - run: python -m ruff format --check src skills
      - run: python -m mypy src/repotrail
      - run: python -m build
      - run: python skills/repotrail/install.py --host codex --destination .local/codex-skills
      - run: python skills/repotrail/install.py --host claude --destination .local/claude-skills
      - run: python skills/repotrail/scripts/repotrail.py --setup-only --cache-dir ../repotrail-skill-runtime
      - run: python -m repotrail --version
      - run: python -m repotrail --help
